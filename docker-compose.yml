services:
  yedii_landing_frontend:
    build: .
    image: yedii/yedii_landing_application-frontend:latest
    container_name: yedii_landing_frontend
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - .env.Development
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
