name: CI & Docker Verification

on:
  push:
    branches:
      - main
      - Development
  pull_request:
    branches:
      - main
      - Development

jobs:
  code-quality:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 4001

  docker-build:
    name: Docker Image Build & Port 4001 Verification
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yedii-landing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Starts on Port 4001
        run: |
          docker run -d -p 4001:4001 --name test-app yedii-landing:latest
          sleep 6
          curl -f http://127.0.0.1:4001/ || (docker logs test-app && exit 1)
          docker rm -f test-app
